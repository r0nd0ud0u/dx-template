name: test

on:
  push:
  workflow_dispatch:

permissions:
  pull-requests: write
  repository-projects: write

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      # https://github.com/DioxusLabs/dioxus/blob/main/.github/workflows/main.yml#L167
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 2.0
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Update rust
        run: rustup update stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: install dioxus
        shell: bash
        run: cargo binstall dioxus-cli@0.7.9 --force

      # https://github.com/DioxusLabs/dioxus/issues/3433
      # - name: check dioxus formatting
      #   shell: bash
      #   run: |
      #     dx fmt --check

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features

      - name: Check dioxus build
        shell: bash
        run: |
          dx build --web
