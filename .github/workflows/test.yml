name: test

on:
  push:
  workflow_dispatch:

permissions:
  pull-requests: write
  repository-projects: write

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
      # apt mirrors occasionally 404 on a transitive dep (e.g. gst-plugins-good)
      # right after `apt-get update` refreshes the index but before the pool
      # file has synced to the mirror we land on; retry to ride it out.
      - name: Install apt packages
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
              && break
            echo "apt install failed (attempt $i), retrying..."
            sleep 5
          done
      - name: Checkout repo
        uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Update rust
        run: rustup update stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: install dioxus
        shell: bash
        run: cargo binstall dioxus-cli@0.7.9 --force

      # https://github.com/DioxusLabs/dioxus/issues/3433
      # - name: check dioxus formatting
      #   shell: bash
      #   run: |
      #     dx fmt --check

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features

      - name: Check dioxus build
        shell: bash
        run: |
          dx build --web
