[package]
name = "dx-template"
version = "0.1.0"
authors = ["r0ndoudou"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "1.0.103"
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
serde = "1.0.228"
dioxus-desktop = { version = "0.7.9", optional = true }
dioxus-html = "0.7.9"
tokio = { version = "1.52.3", features = ["full"], optional = true }
once_cell = "1.21.3"
serde_json = "1.0.150"
# dioxus 0.7 is using getrandom 0.3.3
getrandom = { version = "0.4.3", features = ["wasm_js"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false, version = "0.0.1" }

async-trait = { version = "0.1.88", optional = true }
sqlx = { version = "0.9.0", features = [
    "macros",
    "migrate",
    "sqlite",
    "_unstable-all-types",
    "tls-native-tls",
    "runtime-tokio",
], optional = true }
axum = { version = "0.8.9", features = ["macros"], optional = true }
tower-http = { version = "0.7.0", features = ["auth"], optional = true }
http = { version = "1.4.2", optional = true }
tower = { version = "0.5.3", optional = true }
governor = { version = "0.10", optional = true }
dioxus-web = { version = "0.7.9", features = ["hydrate"], optional = true }
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", optional = true }
axum_session_sqlx = { version = "0.10.0", features = ["sqlite"], optional = true }
bcrypt = { version = "0.19.2", optional = true }
rand = "0.9.2"
dioxus-sdk-storage = "0.7.0"
dotenv = "0.15.0"
dioxus-i18n = "0.5.1"
unic-langid = { version = "0.9.6", features = ["macros"] }

[features]
default = ["server"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:async-trait",
    "dep:sqlx",
    "dep:http",
    "dep:tower",
    "dep:governor",
    "dep:axum_session",
    "dep:axum_session_auth",
    "dep:axum_session_sqlx",
    "bcrypt",
]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
